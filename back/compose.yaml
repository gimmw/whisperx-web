services:
  whisper-back:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whisper-back
    restart: unless-stopped
    # No "ports" mapping: the backend is reached only through the frontend's
    # /api proxy on the internal network. Publishing 49585 to the host would
    # expose the unauthenticated API directly, which no CORS setting prevents.
    # Uncomment to expose it for debugging:
    # ports:
    #   - "127.0.0.1:49585:49585"
    expose:
      - "49585"
    environment:
      - HF_TOKEN=${HF_TOKEN}
      # Not needed while the frontend proxies through /api (same-origin, so
      # CORS never applies). Set it to a comma-separated origin list only if a
      # browser on another origin must call this backend directly.
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      # Maximum accepted upload size in MB.
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-512}
      # Duration cap. Bounds decoded memory (64 KB/s), which the upload size
      # limit cannot: compressed size says nothing about how far it expands.
      - MAX_AUDIO_SECONDS=${MAX_AUDIO_SECONDS:-14400}
      # Abandon a decode that runs this long, so a malformed file cannot hang
      # the worker thread and stall the queue.
      - FFMPEG_TIMEOUT=${FFMPEG_TIMEOUT:-1800}
      # Total jobs queued or running at once. The worker is serial, so this
      # multiplied by the median job time is roughly the worst-case wait.
      - MAX_QUEUE_DEPTH=${MAX_QUEUE_DEPTH:-10}
      # Jobs one client may have queued or running at once. Clients are
      # identified by the X-Real-IP the frontend proxy sets, which is only
      # trustworthy while this service stays unpublished (see above).
      - MAX_JOBS_PER_CLIENT=${MAX_JOBS_PER_CLIENT:-2}
      # You can also set CUDA_VISIBLE_DEVICES if needed
    volumes:
      - whisper-data:/ws/tmp-whisper
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [compute, utility]

  whisper-front:
    build:
      # The frontend Dockerfile copies package.json, src/ and front/, so its
      # build context is the repo root rather than this directory.
      context: ..
      dockerfile: front/Dockerfile
    container_name: whisper-front
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Defaults to /api (proxied to whisper-back). Override only to point the
      # browser at an absolute backend URL, which reintroduces CORS.
      - BACKEND_HOST=${BACKEND_HOST:-/api}
      - TITLE=${TITLE:-}
    depends_on:
      - whisper-back

volumes:
  whisper-data:
