server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads are large; the default 1m would reject most audio/video files.
    # 0 disables nginx's own cap and defers entirely to the backend's
    # MAX_UPLOAD_MB, keeping the limit configured in exactly one place.
    client_max_body_size 0;

    # Proxy the API so the browser sees a single origin and CORS never applies:
    # no preflights, no allowlist to maintain. The trailing slash on proxy_pass
    # strips the /api/ prefix, so /api/upload reaches the backend as /upload.
    # "^~" is required: nginx evaluates regex locations before prefix ones, so
    # without it the static-asset regex below would capture proxied paths that
    # happen to end in a matched extension and serve a 404 from disk instead.
    location ^~ /api/ {
        proxy_pass http://whisper-web-backend:49585/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream uploads straight through instead of buffering the whole body
        # to a temp file first.
        proxy_request_buffering off;

        # Transcription is slow; the 60s default would abort long jobs.
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # SPA fallback: serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache env.js (runtime config, regenerated on container start)
    location = /env.js {
        add_header Cache-Control "no-store";
    }

    # Cache static assets (Vite produces content-hashed filenames)
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
