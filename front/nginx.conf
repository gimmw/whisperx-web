# Shared-memory zones for the upload limits below. These must live at http
# level, which this file is: conf.d/*.conf is included inside the http block.
#
# The key is the client address. $binary_remote_addr rather than $remote_addr
# because it stores 4 bytes for IPv4 instead of up to 15, so a 1m zone holds
# ~16k clients -- far more than this service will ever see concurrently.
#
# IMPORTANT: $remote_addr is the true client only when this nginx is the edge,
# which is the case for the compose deployment. Behind another proxy (a k8s
# Ingress, a CDN) every request arrives from that proxy's IP, so all clients
# would collapse into a single key and the limits below would apply globally --
# one user's uploads would block everyone. In that setup, uncomment the realip
# block in the server below so $remote_addr resolves to the real client.
limit_conn_zone $binary_remote_addr zone=upload_conn:1m;
limit_req_zone $binary_remote_addr zone=upload_req:1m rate=30r/m;

server {
    listen 8080;
    server_name _;

    # Behind an Ingress/CDN, uncomment and set to the trusted proxy's address
    # range so $remote_addr (and therefore the limit keys above, and the
    # X-Real-IP the backend uses for its own per-client quota) becomes the real
    # client rather than the proxy. Only list ranges you control: whatever is
    # trusted here can spoof its client address.
    #set_real_ip_from 10.0.0.0/8;
    #real_ip_header X-Forwarded-For;
    #real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads are large; the default 1m would reject most audio/video files.
    #
    # Deliberately NOT 0. Disabling this defers the entire limit to the
    # backend, which means every oversized body is proxied in full before
    # anything rejects it -- nginx streams it with proxy_request_buffering off,
    # so the cost lands on the backend's socket and disk regardless of how
    # early the backend then refuses.
    #
    # Set this slightly above the backend's MAX_UPLOAD_MB (512m default). The
    # duplication is intentional: nginx enforces on bytes actually received and
    # can refuse at the edge, while the backend enforces the exact limit and
    # produces the JSON error the SPA displays. Raise both together, and keep
    # this the looser of the two so the backend's message is what users see.
    client_max_body_size 528m;

    # "/api/upload/" (trailing slash) normalised onto the limited location
    # below. Without this it misses that exact match, falls through to the
    # unlimited "^~ /api/" block and reaches the backend with every limit
    # bypassed -- verified against real nginx, it returned 200 indefinitely.
    # A regex location cannot cover it: "^~" is chosen over regexes, so nginx
    # would never evaluate one. An exact match is the only form tested before
    # "^~", hence a second exact location that re-enters the first, keeping a
    # single copy of the limit and proxy config.
    location = /api/upload/ {
        rewrite ^ /api/upload last;
    }

    # Upload endpoint, rate- and concurrency-limited.
    #
    # This MUST be a separate location from the general /api/ proxy below, and
    # it must be an exact match ("location ="), which nginx evaluates before
    # any prefix or regex location. Putting these limits on /api/ as a whole
    # would throttle the progress page, which polls once per second per open
    # tab (see checkProgress in src/lib/Progress.svelte) and would trip a 30r/m
    # limit within seconds of a single tab being open.
    #
    # Why this exists on top of the backend's MAX_QUEUE_DEPTH: uploads stream
    # with proxy_request_buffering off, so a client opening many slow uploads
    # consumes sockets and disk for as long as they keep dribbling bytes. Those
    # requests hold a backend queue slot each, but the connections themselves
    # are the resource being defended here, and nginx can refuse them without
    # ever waking the backend.
    location = /api/upload {
        # Concurrent in-flight uploads per client. Two allows a second upload
        # to start while the first is still going, which the UI permits, while
        # still bounding the socket/disk cost of any one client.
        limit_conn upload_conn 2;

        # Burst of 5 absorbs a user queueing up several files at once without
        # rejecting them; nodelay serves that burst immediately rather than
        # trickling it out at the 30r/m sustained rate, which for an upload
        # would look like a hang.
        limit_req zone=upload_req burst=5 nodelay;

        # 429 rather than nginx's default 503: the cause is client-side rate,
        # and it matches what the backend returns for its own per-client quota.
        limit_conn_status 429;
        limit_req_status 429;

        # Log rejections at warn. Both directives default to [error], which
        # would make a client hitting their own limit indistinguishable from a
        # real server fault in the logs.
        limit_conn_log_level warn;
        limit_req_log_level warn;

        # The SPA shows res.error from the JSON body (see upload() in
        # src/lib/Home.svelte), so return that shape rather than nginx's HTML
        # error page, which would surface as an unhelpful generic failure.
        error_page 429 = @upload_limited;

        proxy_pass http://whisper-web-backend:49585/upload;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # JSON body for a limited upload, matching the backend's error shape.
    location @upload_limited {
        internal;
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"error":"Too many uploads at once. Please wait a moment and try again."}';
    }

    # Proxy the API so the browser sees a single origin and CORS never applies:
    # no preflights, no allowlist to maintain. The trailing slash on proxy_pass
    # strips the /api/ prefix, so /api/upload reaches the backend as /upload.
    # "^~" is required: nginx evaluates regex locations before prefix ones, so
    # without it the static-asset regex below would capture proxied paths that
    # happen to end in a matched extension and serve a 404 from disk instead.
    location ^~ /api/ {
        proxy_pass http://whisper-web-backend:49585/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream uploads straight through instead of buffering the whole body
        # to a temp file first.
        proxy_request_buffering off;

        # Transcription is slow; the 60s default would abort long jobs.
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # SPA fallback: serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache env.js (runtime config, regenerated on container start)
    location = /env.js {
        add_header Cache-Control "no-store";
    }

    # Cache static assets (Vite produces content-hashed filenames)
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
